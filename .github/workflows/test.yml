name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: node tools/validate.mjs
      - run: node tools/pack.mjs
      # Run the payload and ZIP through Plugin Hub's own catalog code.
      - uses: actions/checkout@v4
        with:
          repository: crosspoint-reader/crosspoint-plugin-hub
          path: .plugin-hub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_with_plugin_hub.py .plugin-hub
